name: Validate Tico Bot

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Integrity and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Check repository integrity
        run: node src/scripts/validate-repository.cjs
      - name: Install dependencies
        run: npm ci
      - name: Install Firebase Functions dependencies
        run: npm ci --prefix functions
      - name: Run all tests
        run: npm test
